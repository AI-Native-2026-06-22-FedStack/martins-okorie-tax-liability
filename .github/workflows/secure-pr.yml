name: secure-pr

on:
  pull_request:

permissions:
  id-token: write
  contents: read

jobs:
  # ============================================================================
  # Build Gate Job (Required Status Check)
  # Compiles TypeScript and validates workspace build integrity
  # ============================================================================
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build workspace
        run: npm run typecheck

  # ============================================================================
  # Test Gate Job (Required Status Check)
  # Runs unit and integration test suites
  # ============================================================================
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv and Python dependencies
        run: |
          pip install uv
          uv sync --all-packages

      - name: Run Python unit tests
        run: uv run pytest services/compute/tests -v

  # ============================================================================
  # OIDC Authentication Job
  # Proves identity to AWS STS using short-lived credentials; no stored keys.
  # ============================================================================
  oidc-auth:
    name: oidc-auth
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate AWS_ROLE_ARN configuration
        run: |
          if [ -z "${{ vars.AWS_ROLE_ARN }}" ]; then
            echo "::error::Repository variable AWS_ROLE_ARN is unset. Please configure AWS_ROLE_ARN in GitHub: Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Verify assumed identity (proves keyless token exchange)
        run: |
          echo "Verifying AWS STS Caller Identity via OIDC Assumed Role..."
          aws sts get-caller-identity

  # ============================================================================
  # SAST Scanner Job (Required Status Check)
  # Runs Semgrep (cross-language + custom rules), ESLint-security (Node), and Bandit (Python)
  # ============================================================================
  sast:
    name: sast
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run ESLint Security Scanners (Node/Express)
        run: |
          mkdir -p artifacts/security
          npx eslint apps/api/src --format json -o artifacts/security/eslint-security-results.json || true
          npx eslint apps/api/src

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python SAST tools
        run: |
          pip install --upgrade pip
          pip install bandit bandit-sarif-formatter semgrep

      - name: Run Bandit (FastAPI Tax Engine)
        run: |
          bandit -r services/compute -x services/compute/tests -f sarif -o artifacts/security/bandit-results.sarif || true
          bandit -r services/compute -x services/compute/tests -lll

      - name: Run Semgrep Custom Rule (Blocking at ERROR)
        run: |
          semgrep --validate --config .semgrep/
          semgrep scan --config .semgrep/ --sarif --output artifacts/security/semgrep-custom.sarif --error .

      - name: Run Semgrep Community Rules (Audit Evidence Collection)
        run: |
          semgrep scan --config "p/ci" --config "p/owasp-top-ten" --sarif --output artifacts/security/semgrep-results.sarif . || true

      - name: Upload SAST evidence artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-evidence
          path: artifacts/security/*

  # ============================================================================
  # SCA Scanner Job (Required Status Check)
  # Runs OSV-Scanner against dependencies across npm and Python ecosystems
  # ============================================================================
  sca:
    name: sca
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OSV-Scanner CLI
        run: |
          mkdir -p /tmp/bin
          curl -sSL https://github.com/google/osv-scanner/releases/download/v1.9.2/osv-scanner_1.9.2_linux_amd64 -o /tmp/bin/osv-scanner
          chmod +x /tmp/bin/osv-scanner
          echo "/tmp/bin" >> $GITHUB_PATH

      - name: Run OSV-Scanner
        run: |
          mkdir -p artifacts/security
          osv-scanner -r . --format json --output-file artifacts/security/osv-scanner-results.json || true

      - name: Upload SCA evidence artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sca-evidence
          path: artifacts/security/osv-scanner-results.json

  # ============================================================================
  # Secret Scanner Job (Required Status Check)
  # Runs Gitleaks CLI over FULL git history (fetch-depth: 0) — 100% Free Open Source CLI
  # ============================================================================
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history required to catch secrets across past commits

      - name: Install Gitleaks CLI
        run: |
          mkdir -p /tmp/bin
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz | tar -xz -C /tmp/bin gitleaks
          chmod +x /tmp/bin/gitleaks
          echo "/tmp/bin" >> $GITHUB_PATH

      - name: Run Gitleaks Full History Scan
        run: |
          mkdir -p artifacts/security
          gitleaks detect \
            --config .gitleaks.toml \
            --gitleaks-ignore-path .gitleaksignore \
            --report-path artifacts/security/gitleaks-results.json \
            --report-format json \
            --verbose

      - name: Upload Secret Scanning evidence artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secrets-evidence
          path: artifacts/security/gitleaks-results.json
