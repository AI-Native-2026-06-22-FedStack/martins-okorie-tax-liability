name: secure-pr

on:
  pull_request:

permissions:
  id-token: write
  contents: read

jobs:
  # ============================================================================
  # Build Gate Job (Required Status Check)
  # Compiles TypeScript and validates workspace build integrity
  # ============================================================================
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build workspace
        run: npm run typecheck

  # ============================================================================
  # Test Gate Job (Required Status Check)
  # Runs unit and integration test suites
  # ============================================================================
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv and Python dependencies
        run: |
          pip install uv
          uv sync --all-packages

      - name: Run Python unit tests
        run: uv run pytest services/compute/tests -v

  # ============================================================================
  # OIDC Authentication Job
  # Proves identity to AWS STS using short-lived credentials; no stored keys.
  # ============================================================================
  oidc-auth:
    name: oidc-auth
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate AWS_ROLE_ARN configuration
        run: |
          if [ -z "${{ vars.AWS_ROLE_ARN }}" ]; then
            echo "::error::Repository variable AWS_ROLE_ARN is unset. Please configure AWS_ROLE_ARN in GitHub: Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Verify assumed identity (proves keyless token exchange)
        run: |
          echo "Verifying AWS STS Caller Identity via OIDC Assumed Role..."
          aws sts get-caller-identity

  # ============================================================================
  # SAST Scanner Job (Required Status Check)
  # Runs Semgrep (cross-language + custom rules), ESLint-security (Node), and Bandit (Python)
  # ============================================================================
  sast:
    name: sast
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run ESLint Security Scanners (Node/Express)
        run: |
          mkdir -p artifacts/security
          npx eslint apps/api/src --format json -o artifacts/security/eslint-security-results.json || true
          npx eslint apps/api/src

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python SAST tools
        run: |
          pip install --upgrade pip
          pip install bandit bandit-sarif-formatter

      - name: Run Bandit (FastAPI Tax Engine)
        run: |
          bandit -r services/compute -x services/compute/tests -f sarif -o artifacts/security/bandit-results.sarif || true
          bandit -r services/compute -x services/compute/tests -lll

      - name: Run Semgrep CE (Community Rules + Custom PII Rule)
        run: |
          pip install semgrep
          semgrep --validate --config .semgrep/
          semgrep scan --config .semgrep/ --config "p/ci" --config "p/owasp-top-ten" --sarif --output artifacts/security/semgrep-results.sarif --error .

      - name: Upload SAST evidence artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-evidence
          path: artifacts/security/*

  # ============================================================================
  # SCA Scanner Job (Required Status Check)
  # Runs OSV-Scanner against dependencies across npm and Python ecosystems
  # ============================================================================
  sca:
    name: sca
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run OSV-Scanner Action
        uses: google/osv-scanner-action@v2
        continue-on-error: true
        with:
          scan-args: |-
            -r
            --format=json
            --output-file=osv-scanner-results.json
            .

      - name: Save OSV-Scanner Evidence
        run: |
          mkdir -p artifacts/security
          if [ -f osv-scanner-results.json ]; then
            cp osv-scanner-results.json artifacts/security/osv-scanner-results.json
          fi

      - name: Upload SCA evidence artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sca-evidence
          path: artifacts/security/osv-scanner-results.json

  # ============================================================================
  # Secret Scanner Job (Required Status Check)
  # Runs Gitleaks over FULL git history (fetch-depth: 0) and local configurations
  # ============================================================================
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history required to catch secrets across past commits

      - name: Run Gitleaks Full History Scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_IGNORE_PATH: .gitleaksignore
          GITLEAKS_REPORT_PATH: artifacts/security/gitleaks-results.json
          GITLEAKS_REPORT_FORMAT: json

      - name: Upload Secret Scanning evidence artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secrets-evidence
          path: artifacts/security/gitleaks-results.json
