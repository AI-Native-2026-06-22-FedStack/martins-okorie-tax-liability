name: iac-scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  iac-scan:
    name: Checkov & Trivy IaC Scan Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Checkov
        run: |
          python -m pip install --upgrade pip
          pip install checkov

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: 'infra/terraform'
          format: 'sarif'
          output: 'artifacts/security/trivy-results.sarif'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

      - name: Run Checkov scan
        run: |
          mkdir -p artifacts/security
          checkov -d infra/terraform/ --output sarif --output-file-path artifacts/security/results_sarif.sarif

      - name: Retain security SARIF evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iac-scan-sarif-evidence
          path: artifacts/security/*.sarif
