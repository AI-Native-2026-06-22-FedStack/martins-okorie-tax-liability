name: ai-quality

on:
  pull_request:
    paths:
      - 'services/retrieval/**'
      - 'services/compute/assist.py'
      - 'data/corpus/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ragas-quality-gate:
    name: RAGAS Quality Gate (Required Status Check)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: taxpulse_app
          POSTGRES_PASSWORD: password
          POSTGRES_DB: taxpulse_l
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Apply database migrations
        env:
          DATABASE_URL: postgresql://taxpulse_app:password@localhost:5432/taxpulse_l
        run: |
          for f in $(ls apps/api/db/migrations/*.sql | sort); do
            echo "Applying $f..."
            psql "$DATABASE_URL" -f "$f"
          done

      - name: Run RAGAS Quality Gate
        env:
          DATABASE_URL: postgresql://taxpulse_app:password@localhost:5432/taxpulse_l
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RAGAS_EVAL_SET: eval_set.jsonl
        run: |
          uv run pytest -v services/retrieval/eval/test_ragas_gate.py
