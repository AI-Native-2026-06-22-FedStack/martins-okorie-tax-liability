name: cosign-sign

on:
  workflow_call:
    inputs:
      image:
        description: "Target container image reference to sign and verify"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  sign-and-verify:
    name: sign-and-verify
    runs-on: ubuntu-latest
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Keyless sign container image via GitHub OIDC identity
        run: |
          echo "Signing container image ${{ inputs.image }} with ephemeral OIDC certificate..."
          cosign sign --yes "${{ inputs.image }}"

      - name: Verify signature against Rekor transparency log before deploy
        run: |
          echo "Verifying Rekor transparency log and OIDC identity for ${{ inputs.image }}..."
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github.com/AI-Native-2026-06-22-FedStack/martins-okorie-tax-liability/\.github/workflows/release\.yml@refs/heads/main$' \
            "${{ inputs.image }}"
