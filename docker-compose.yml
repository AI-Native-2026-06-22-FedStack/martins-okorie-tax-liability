# Canonical local TaxPulse stack for Week 7 Day 2.
# All AWS-shaped calls target floci at http://floci:4566 inside the stack and
# http://localhost:4566 from the host.

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: taxpulse_l
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: taxpulse_app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxpulse_app -d taxpulse_l"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    ports:
      - "55433:5432"
    networks:
      - taxpulse-local

  redis:
    image: redis:7.4.5-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    ports:
      - "6379:6379"
    networks:
      - taxpulse-local

  floci:
    image: floci/floci:latest-compat
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_STORAGE_MODE: memory
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4566/_localstack/health', timeout=2)\""
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    ports:
      - "4566:4566"
    networks:
      - taxpulse-local

  compute:
    image: taxpulse-compute:w7d1
    pull_policy: never
    environment:
      JWT_AUDIENCE: taxpulse-clients
      JWT_ISSUER: taxpulse-api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8000"
    networks:
      - taxpulse-local

  api:
    image: taxpulse-api:w7d1
    pull_policy: never
    env_file:
      - .env.local
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_ENDPOINT: http://floci:4566
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_REGION: us-east-1
      AWS_SECRET_ACCESS_KEY: test
      COMPUTE_SERVICE_URL: http://compute:8000
      DB_HOST: postgres
      DB_NAME: taxpulse_l
      DB_PORT: "5432"
      DB_SECRET_ID: taxpulse/local/db-password
      DB_SSL: disable
      DB_USER: taxpulse_app
      DDB_ENDPOINT: http://floci:4566
      JWT_AUDIENCE: taxpulse-clients
      JWT_ISSUER: taxpulse-api
      JWT_SECRET_ID: taxpulse/local/jwt-signing-keys
      PORT: "3000"
      REDIS_URL: redis://redis:6379
    depends_on:
      compute:
        condition: service_healthy
      floci:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - taxpulse-local

  tivs-acl:
    image: node:24.17.0-trixie-slim
    profiles: ["brownfield"]
    working_dir: /workspace/services/tivs-acl
    command:
      - sh
      - -lc
      - |
        npm ci
        node --input-type=module -e "
          import express from 'express';
          const app = express();
          app.use(express.json());
          app.get('/health', (_req, res) => res.json({ service: 'tivs-acl', status: 'ok' }));
          app.post('/v1/taxpayer-status', (_req, res) => res.json({ status: 'current' }));
          app.post('/v1/taxpayer-verifications', (_req, res) => res.json({ verified: true }));
          app.listen(Number(process.env.ACL_PORT || 4300), '0.0.0.0', () => {
            console.info('TIVS ACL brownfield mock listening');
          });
        "
    environment:
      ACL_PORT: "4300"
      NODE_ENV: production
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const http=require('node:http'); const req=http.request({hostname:'127.0.0.1',port:4300,path:'/health',timeout:2000},res=>process.exit(res.statusCode<500?0:1)); req.on('error',()=>process.exit(1)); req.end();\""
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    ports:
      - "4300:4300"
    volumes:
      - .:/workspace:ro
      - tivs-acl-node-modules:/workspace/services/tivs-acl/node_modules
    networks:
      - taxpulse-local

networks:
  taxpulse-local:
    driver: bridge

volumes:
  tivs-acl-node-modules:
