# TaxPulse local development stack: Express Core, FastAPI Tax Engine, Postgres, DynamoDB Local, Redis, LocalStack, and Pact Broker.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: taxpulse_l
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: taxpulse_app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxpulse_app -d taxpulse_l"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "5433:5432"

  dynamodb-local:
    image: amazon/dynamodb-local:2.5.3
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    healthcheck:
      test: ["CMD-SHELL", "java -version >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "8000:8000"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "6379:6379"

  localstack:
    image: localstack/localstack:3.8.1
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,sqs,sns
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:4566/_localstack/health | grep -Eq '\"s3\": \"(running|available)\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  pact-broker-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pact_broker
      POSTGRES_USER: pact_broker
      POSTGRES_PASSWORD: pact_broker_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pact_broker -d pact_broker"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "5434:5432"

  pact-broker:
    image: pactfoundation/pact-broker:latest
    ports:
      - "9292:9292"
    environment:
      PACT_BROKER_DATABASE_ADAPTER: postgres
      PACT_BROKER_DATABASE_HOSTNAME: pact-broker-db
      PACT_BROKER_DATABASE_PORT: "5432"
      PACT_BROKER_DATABASE_NAME: pact_broker
      PACT_BROKER_DATABASE_USER: pact_broker
      PACT_BROKER_DATABASE_PASSWORD: pact_broker_password
      PACT_BROKER_LOG_LEVEL: INFO
    depends_on:
      pact-broker-db:
        condition: service_healthy

  compute:
    build:
      context: ./services/compute
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URI=postgres://taxpulse_app@postgres:5432/taxpulse_l
      - REDIS_URL=redis://redis:6379
      - COMPUTE_SERVICE_URL=http://compute:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      compute:
        condition: service_started
