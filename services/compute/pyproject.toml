[project]
name = "compute"
version = "0.1.0"
description = "TaxPulse calculation engine microservice"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography==50.0.0",
    "fastapi==0.139.0",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "pwdlib[argon2]==0.3.0",
    "pydantic==2.13.4",
    "pyjwt==2.13.0",
    "structlog==26.1.0",
    "tenacity==9.1.4",
    "uvicorn==0.51.0",
]

[dependency-groups]
dev = [
    "pact-python==3.4.0",
    "pytest==8.4.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
