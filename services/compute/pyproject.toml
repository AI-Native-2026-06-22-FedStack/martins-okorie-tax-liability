[project]
name = "compute"
version = "0.1.0"
description = "TaxPulse calculation engine microservice"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=49.0.0",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "jsonschema>=4.20.0",
    "pact-python>=2.0.0",
    "pwdlib[argon2]>=0.3.0",
    "pydantic>=2.0.0",
    "pyjwt>=2.8",
    "structlog>=26.1.0",
    "tenacity>=8.2.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
